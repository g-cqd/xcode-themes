<text x="22" y="85" xml:space="preserve"><tspan fill="#cdcabd" fill-opacity="0.550">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#d9b260">@Observable </tspan><tspan fill="#e98d00">final class </tspan><tspan fill="#ebd600">Counter</tspan><tspan fill="#cecab7"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#cecab7">    </tspan><tspan fill="#e98d00">var </tspan><tspan fill="#ece5c9">value</tspan><tspan fill="#cecab7">: </tspan><tspan fill="#d2b300">Int</tspan><tspan fill="#cecab7"> = </tspan><tspan fill="#a2dd57">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#cecab7">    </tspan><tspan fill="#e98d00">let </tspan><tspan fill="#ece5c9">label</tspan><tspan fill="#cecab7"> = </tspan><tspan fill="#b5df97">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#cecab7">    </tspan><tspan fill="#e98d00">func </tspan><tspan fill="#ece5c9">bump</tspan><tspan fill="#cecab7">(</tspan><tspan fill="#ece5c9">by</tspan><tspan fill="#cecab7"> step: </tspan><tspan fill="#d2b300">Int</tspan><tspan fill="#cecab7">) { </tspan><tspan fill="#cecab7">value</tspan><tspan fill="#cecab7"> += </tspan><tspan fill="#cecab7">step</tspan><tspan fill="#cecab7"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#cecab7">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#e98d00">struct </tspan><tspan fill="#ebd600">CounterView</tspan><tspan fill="#cecab7">: </tspan><tspan fill="#d2b300">View</tspan><tspan fill="#cecab7"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#cecab7">    </tspan><tspan fill="#d9b260">@State </tspan><tspan fill="#e98d00">private var </tspan><tspan fill="#ece5c9">model</tspan><tspan fill="#cecab7"> = </tspan><tspan fill="#ebd600">Counter</tspan><tspan fill="#cecab7">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#cecab7">    </tspan><tspan fill="#e98d00">var </tspan><tspan fill="#ece5c9">body</tspan><tspan fill="#cecab7">: </tspan><tspan fill="#e98d00">some </tspan><tspan fill="#d2b300">View</tspan><tspan fill="#cecab7"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#cecab7">        </tspan><tspan fill="#d2b300">Button</tspan><tspan fill="#cecab7">(</tspan><tspan fill="#cecab7">model</tspan><tspan fill="#cecab7">.</tspan><tspan fill="#cecab7">label</tspan><tspan fill="#cecab7">) { </tspan><tspan fill="#cecab7">model</tspan><tspan fill="#cecab7">.</tspan><tspan fill="#e3ec52">bump</tspan><tspan fill="#cecab7">(by: </tspan><tspan fill="#a2dd57">1</tspan><tspan fill="#cecab7">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#cecab7">            .</tspan><tspan fill="#c9d03e">padding</tspan><tspan fill="#cecab7">(</tspan><tspan fill="#b9c255">.pi</tspan><tspan fill="#cecab7"> * </tspan><tspan fill="#a2dd57">2</tspan><tspan fill="#cecab7">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#cecab7">            .</tspan><tspan fill="#c9d03e">accessibilityLabel</tspan><tspan fill="#cecab7">(</tspan><tspan fill="#b5df97">&quot;Increment&quot;</tspan><tspan fill="#cecab7">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#cecab7">    </tspan><tspan fill="#cecab7">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#cecab7">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#dc7b00">#if </tspan><tspan fill="#dc7b00">DEBUG</tspan><tspan fill="#cecab7">   </tspan><tspan fill="#cdcabd" fill-opacity="0.825">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#e98d00">let </tspan><tspan fill="#ece5c9">re</tspan><tspan fill="#cecab7"> = </tspan><tspan fill="#ccf3a7">/[a-z]+\d{2}/</tspan><tspan fill="#cecab7">; </tspan><tspan fill="#e98d00">let </tspan><tspan fill="#ece5c9">c</tspan><tspan fill="#cecab7">: </tspan><tspan fill="#d2b300">Character</tspan><tspan fill="#cecab7"> = </tspan><tspan fill="#d09500">&quot;x&quot;</tspan></text>
