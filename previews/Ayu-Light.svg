<text x="22" y="22" xml:space="preserve"><tspan fill="#bbbcbf" fill-opacity="0.600">// Xcode theme preview — Ayu, Comfort, GitHub…</tspan></text>
<text x="22" y="43" xml:space="preserve"><tspan fill="#fd953f">import </tspan><tspan fill="#50afcb">SwiftUI</tspan></text>
<text x="22" y="64" xml:space="preserve"></text>
<text x="22" y="85" xml:space="preserve"><tspan fill="#bbbcbf" fill-opacity="0.750">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#e8a85a">@Observable </tspan><tspan fill="#fd953f">final class </tspan><tspan fill="#2db3eb">Counter</tspan><tspan fill="#6f7479"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#6f7479">    </tspan><tspan fill="#fd953f">var </tspan><tspan fill="#51575d">value</tspan><tspan fill="#6f7479">: </tspan><tspan fill="#50afcb">Int</tspan><tspan fill="#6f7479"> = </tspan><tspan fill="#bb96de">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#6f7479">    </tspan><tspan fill="#fd953f">let </tspan><tspan fill="#51575d">label</tspan><tspan fill="#6f7479"> = </tspan><tspan fill="#98c000">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#6f7479">    </tspan><tspan fill="#fd953f">func </tspan><tspan fill="#51575d">bump</tspan><tspan fill="#6f7479">(</tspan><tspan fill="#51575d">by</tspan><tspan fill="#6f7479"> step: </tspan><tspan fill="#50afcb">Int</tspan><tspan fill="#6f7479">) { </tspan><tspan fill="#6f7479">value</tspan><tspan fill="#6f7479"> += </tspan><tspan fill="#6f7479">step</tspan><tspan fill="#6f7479"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#6f7479">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#fd953f">struct </tspan><tspan fill="#2db3eb">CounterView</tspan><tspan fill="#6f7479">: </tspan><tspan fill="#50afcb">View</tspan><tspan fill="#6f7479"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#6f7479">    </tspan><tspan fill="#e8a85a">@State </tspan><tspan fill="#fd953f">private var </tspan><tspan fill="#51575d">model</tspan><tspan fill="#6f7479"> = </tspan><tspan fill="#2db3eb">Counter</tspan><tspan fill="#6f7479">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#6f7479">    </tspan><tspan fill="#fd953f">var </tspan><tspan fill="#51575d">body</tspan><tspan fill="#6f7479">: </tspan><tspan fill="#fd953f">some </tspan><tspan fill="#50afcb">View</tspan><tspan fill="#6f7479"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#6f7479">        </tspan><tspan fill="#50afcb">Button</tspan><tspan fill="#6f7479">(</tspan><tspan fill="#6f7479">model</tspan><tspan fill="#6f7479">.</tspan><tspan fill="#6f7479">label</tspan><tspan fill="#6f7479">) { </tspan><tspan fill="#6f7479">model</tspan><tspan fill="#6f7479">.</tspan><tspan fill="#efb400">bump</tspan><tspan fill="#6f7479">(by: </tspan><tspan fill="#bb96de">1</tspan><tspan fill="#6f7479">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#6f7479">            .</tspan><tspan fill="#fc8e8d">padding</tspan><tspan fill="#6f7479">(</tspan><tspan fill="#f1ad9e">.pi</tspan><tspan fill="#6f7479"> * </tspan><tspan fill="#bb96de">2</tspan><tspan fill="#6f7479">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#6f7479">            .</tspan><tspan fill="#fc8e8d">accessibilityLabel</tspan><tspan fill="#6f7479">(</tspan><tspan fill="#98c000">&quot;Increment&quot;</tspan><tspan fill="#6f7479">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#6f7479">    </tspan><tspan fill="#6f7479">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#6f7479">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#ea7a7b">#if </tspan><tspan fill="#ea7a7b">DEBUG</tspan><tspan fill="#6f7479">   </tspan><tspan fill="#bbbcbf">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#fd953f">let </tspan><tspan fill="#51575d">re</tspan><tspan fill="#6f7479"> = </tspan><tspan fill="#51c2a1">/[a-z]+\d{2}/</tspan><tspan fill="#6f7479">; </tspan><tspan fill="#fd953f">let </tspan><tspan fill="#51575d">c</tspan><tspan fill="#6f7479">: </tspan><tspan fill="#50afcb">Character</tspan><tspan fill="#6f7479"> = </tspan><tspan fill="#6bd3b2">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#fc8e8d">print</tspan><tspan fill="#6f7479">(</tspan><tspan fill="#78cee9">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#6f7479">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#ea7a7b">#endif</tspan></text>
