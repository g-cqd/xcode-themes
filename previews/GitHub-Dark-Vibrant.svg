<text x="22" y="64" xml:space="preserve"></text>
<text x="22" y="85" xml:space="preserve"><tspan fill="#9da5ae" fill-opacity="0.620">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#f26e00">@Observable </tspan><tspan fill="#e92c1e">final class </tspan><tspan fill="#f38b00">Counter</tspan><tspan fill="#d3dae0"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#d3dae0">    </tspan><tspan fill="#e92c1e">var </tspan><tspan fill="#f0f5f9">value</tspan><tspan fill="#d3dae0">: </tspan><tspan fill="#55b5ff">Int</tspan><tspan fill="#d3dae0"> = </tspan><tspan fill="#0085d4">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#d3dae0">    </tspan><tspan fill="#e92c1e">let </tspan><tspan fill="#f0f5f9">label</tspan><tspan fill="#d3dae0"> = </tspan><tspan fill="#81c2f3">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#d3dae0">    </tspan><tspan fill="#e92c1e">func </tspan><tspan fill="#f0f5f9">bump</tspan><tspan fill="#d3dae0">(</tspan><tspan fill="#f0f5f9">by</tspan><tspan fill="#d3dae0"> step: </tspan><tspan fill="#55b5ff">Int</tspan><tspan fill="#d3dae0">) { </tspan><tspan fill="#d3dae0">value</tspan><tspan fill="#d3dae0"> += </tspan><tspan fill="#d3dae0">step</tspan><tspan fill="#d3dae0"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#d3dae0">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#e92c1e">struct </tspan><tspan fill="#f38b00">CounterView</tspan><tspan fill="#d3dae0">: </tspan><tspan fill="#55b5ff">View</tspan><tspan fill="#d3dae0"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#d3dae0">    </tspan><tspan fill="#f26e00">@State </tspan><tspan fill="#e92c1e">private var </tspan><tspan fill="#f0f5f9">model</tspan><tspan fill="#d3dae0"> = </tspan><tspan fill="#f38b00">Counter</tspan><tspan fill="#d3dae0">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#d3dae0">    </tspan><tspan fill="#e92c1e">var </tspan><tspan fill="#f0f5f9">body</tspan><tspan fill="#d3dae0">: </tspan><tspan fill="#e92c1e">some </tspan><tspan fill="#55b5ff">View</tspan><tspan fill="#d3dae0"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#d3dae0">        </tspan><tspan fill="#55b5ff">Button</tspan><tspan fill="#d3dae0">(</tspan><tspan fill="#d3dae0">model</tspan><tspan fill="#d3dae0">.</tspan><tspan fill="#d3dae0">label</tspan><tspan fill="#d3dae0">) { </tspan><tspan fill="#d3dae0">model</tspan><tspan fill="#d3dae0">.</tspan><tspan fill="#b47cea">bump</tspan><tspan fill="#d3dae0">(by: </tspan><tspan fill="#0085d4">1</tspan><tspan fill="#d3dae0">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#d3dae0">            .</tspan><tspan fill="#c58ffc">padding</tspan><tspan fill="#d3dae0">(</tspan><tspan fill="#1a96e4">.pi</tspan><tspan fill="#d3dae0"> * </tspan><tspan fill="#0085d4">2</tspan><tspan fill="#d3dae0">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#d3dae0">            .</tspan><tspan fill="#c58ffc">accessibilityLabel</tspan><tspan fill="#d3dae0">(</tspan><tspan fill="#81c2f3">&quot;Increment&quot;</tspan><tspan fill="#d3dae0">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#d3dae0">    </tspan><tspan fill="#d3dae0">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#d3dae0">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#f342a6">#if </tspan><tspan fill="#f342a6">DEBUG</tspan><tspan fill="#d3dae0">   </tspan><tspan fill="#9da5ae" fill-opacity="0.930">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#e92c1e">let </tspan><tspan fill="#f0f5f9">re</tspan><tspan fill="#d3dae0"> = </tspan><tspan fill="#58eb66">/[a-z]+\d{2}/</tspan><tspan fill="#d3dae0">; </tspan><tspan fill="#e92c1e">let </tspan><tspan fill="#f0f5f9">c</tspan><tspan fill="#d3dae0">: </tspan><tspan fill="#55b5ff">Character</tspan><tspan fill="#d3dae0"> = </tspan><tspan fill="#fc503f">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#c58ffc">print</tspan><tspan fill="#d3dae0">(</tspan><tspan fill="#81c2f3">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#d3dae0">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#f342a6">#endif</tspan></text>
