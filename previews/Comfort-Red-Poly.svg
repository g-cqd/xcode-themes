<text x="22" y="442" xml:space="preserve"><tspan fill="#ff5661">let </tspan><tspan fill="#fbdcd5">re</tspan><tspan fill="#d9c4bf"> = </tspan><tspan fill="#ffce9f">/[a-z]+\d{2}/</tspan><tspan fill="#d9c4bf">; </tspan><tspan fill="#ff5661">let </tspan><tspan fill="#fbdcd5">c</tspan><tspan fill="#d9c4bf">: </tspan><tspan fill="#ff857a">Character</tspan><tspan fill="#d9c4bf"> = </tspan><tspan fill="#ed7363">&quot;x&quot;</tspan></text>
