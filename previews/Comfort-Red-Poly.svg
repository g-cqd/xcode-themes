<text x="22" y="85" xml:space="preserve"><tspan fill="#d4c6c2" fill-opacity="0.550">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#f39b94">@Observable </tspan><tspan fill="#ff5661">final class </tspan><tspan fill="#ff9f67">Counter</tspan><tspan fill="#d9c4bf"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#d9c4bf">    </tspan><tspan fill="#ff5661">var </tspan><tspan fill="#fbdcd5">value</tspan><tspan fill="#d9c4bf">: </tspan><tspan fill="#ff857a">Int</tspan><tspan fill="#d9c4bf"> = </tspan><tspan fill="#ff9a00">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#d9c4bf">    </tspan><tspan fill="#ff5661">let </tspan><tspan fill="#fbdcd5">label</tspan><tspan fill="#d9c4bf"> = </tspan><tspan fill="#f9bda3">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#d9c4bf">    </tspan><tspan fill="#ff5661">func </tspan><tspan fill="#fbdcd5">bump</tspan><tspan fill="#d9c4bf">(</tspan><tspan fill="#fbdcd5">by</tspan><tspan fill="#d9c4bf"> step: </tspan><tspan fill="#ff857a">Int</tspan><tspan fill="#d9c4bf">) { </tspan><tspan fill="#d9c4bf">value</tspan><tspan fill="#d9c4bf"> += </tspan><tspan fill="#d9c4bf">step</tspan><tspan fill="#d9c4bf"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#d9c4bf">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#ff5661">struct </tspan><tspan fill="#ff9f67">CounterView</tspan><tspan fill="#d9c4bf">: </tspan><tspan fill="#ff857a">View</tspan><tspan fill="#d9c4bf"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#d9c4bf">    </tspan><tspan fill="#f39b94">@State </tspan><tspan fill="#ff5661">private var </tspan><tspan fill="#fbdcd5">model</tspan><tspan fill="#d9c4bf"> = </tspan><tspan fill="#ff9f67">Counter</tspan><tspan fill="#d9c4bf">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#d9c4bf">    </tspan><tspan fill="#ff5661">var </tspan><tspan fill="#fbdcd5">body</tspan><tspan fill="#d9c4bf">: </tspan><tspan fill="#ff5661">some </tspan><tspan fill="#ff857a">View</tspan><tspan fill="#d9c4bf"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#d9c4bf">        </tspan><tspan fill="#ff857a">Button</tspan><tspan fill="#d9c4bf">(</tspan><tspan fill="#d9c4bf">model</tspan><tspan fill="#d9c4bf">.</tspan><tspan fill="#d9c4bf">label</tspan><tspan fill="#d9c4bf">) { </tspan><tspan fill="#d9c4bf">model</tspan><tspan fill="#d9c4bf">.</tspan><tspan fill="#fcaf5c">bump</tspan><tspan fill="#d9c4bf">(by: </tspan><tspan fill="#ff9a00">1</tspan><tspan fill="#d9c4bf">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#d9c4bf">            .</tspan><tspan fill="#eaad86">padding</tspan><tspan fill="#d9c4bf">(</tspan><tspan fill="#f89256">.pi</tspan><tspan fill="#d9c4bf"> * </tspan><tspan fill="#ff9a00">2</tspan><tspan fill="#d9c4bf">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#d9c4bf">            .</tspan><tspan fill="#eaad86">accessibilityLabel</tspan><tspan fill="#d9c4bf">(</tspan><tspan fill="#f9bda3">&quot;Increment&quot;</tspan><tspan fill="#d9c4bf">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#d9c4bf">    </tspan><tspan fill="#d9c4bf">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#d9c4bf">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
