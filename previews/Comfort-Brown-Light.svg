<text x="22" y="85" xml:space="preserve"><tspan fill="#594b3e" fill-opacity="0.550">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#765434">@Observable </tspan><tspan fill="#ac3500">final class </tspan><tspan fill="#6e0401">Counter</tspan><tspan fill="#5d4a37"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#5d4a37">    </tspan><tspan fill="#ac3500">var </tspan><tspan fill="#301906">value</tspan><tspan fill="#5d4a37">: </tspan><tspan fill="#954500">Int</tspan><tspan fill="#5d4a37"> = </tspan><tspan fill="#6f4400">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#5d4a37">    </tspan><tspan fill="#ac3500">let </tspan><tspan fill="#301906">label</tspan><tspan fill="#5d4a37"> = </tspan><tspan fill="#563b00">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#5d4a37">    </tspan><tspan fill="#ac3500">func </tspan><tspan fill="#301906">bump</tspan><tspan fill="#5d4a37">(</tspan><tspan fill="#301906">by</tspan><tspan fill="#5d4a37"> step: </tspan><tspan fill="#954500">Int</tspan><tspan fill="#5d4a37">) { </tspan><tspan fill="#5d4a37">value</tspan><tspan fill="#5d4a37"> += </tspan><tspan fill="#5d4a37">step</tspan><tspan fill="#5d4a37"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#5d4a37">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#ac3500">struct </tspan><tspan fill="#6e0401">CounterView</tspan><tspan fill="#5d4a37">: </tspan><tspan fill="#954500">View</tspan><tspan fill="#5d4a37"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#5d4a37">    </tspan><tspan fill="#765434">@State </tspan><tspan fill="#ac3500">private var </tspan><tspan fill="#301906">model</tspan><tspan fill="#5d4a37"> = </tspan><tspan fill="#6e0401">Counter</tspan><tspan fill="#5d4a37">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#5d4a37">    </tspan><tspan fill="#ac3500">var </tspan><tspan fill="#301906">body</tspan><tspan fill="#5d4a37">: </tspan><tspan fill="#ac3500">some </tspan><tspan fill="#954500">View</tspan><tspan fill="#5d4a37"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#5d4a37">        </tspan><tspan fill="#954500">Button</tspan><tspan fill="#5d4a37">(</tspan><tspan fill="#5d4a37">model</tspan><tspan fill="#5d4a37">.</tspan><tspan fill="#5d4a37">label</tspan><tspan fill="#5d4a37">) { </tspan><tspan fill="#5d4a37">model</tspan><tspan fill="#5d4a37">.</tspan><tspan fill="#550100">bump</tspan><tspan fill="#5d4a37">(by: </tspan><tspan fill="#6f4400">1</tspan><tspan fill="#5d4a37">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#5d4a37">            .</tspan><tspan fill="#6e2700">padding</tspan><tspan fill="#5d4a37">(</tspan><tspan fill="#854c00">.pi</tspan><tspan fill="#5d4a37"> * </tspan><tspan fill="#6f4400">2</tspan><tspan fill="#5d4a37">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#5d4a37">            .</tspan><tspan fill="#6e2700">accessibilityLabel</tspan><tspan fill="#5d4a37">(</tspan><tspan fill="#563b00">&quot;Increment&quot;</tspan><tspan fill="#5d4a37">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#5d4a37">    </tspan><tspan fill="#5d4a37">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#5d4a37">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#b8522e">#if </tspan><tspan fill="#b8522e">DEBUG</tspan><tspan fill="#5d4a37">   </tspan><tspan fill="#594b3e" fill-opacity="0.825">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#ac3500">let </tspan><tspan fill="#301906">re</tspan><tspan fill="#5d4a37"> = </tspan><tspan fill="#412400">/[a-z]+\d{2}/</tspan><tspan fill="#5d4a37">; </tspan><tspan fill="#ac3500">let </tspan><tspan fill="#301906">c</tspan><tspan fill="#5d4a37">: </tspan><tspan fill="#954500">Character</tspan><tspan fill="#5d4a37"> = </tspan><tspan fill="#a35900">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#6e2700">print</tspan><tspan fill="#5d4a37">(</tspan><tspan fill="#563b00">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#5d4a37">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#b8522e">#endif</tspan></text>
