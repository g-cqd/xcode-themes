<text x="22" y="22" xml:space="preserve"><tspan fill="#594b3e" fill-opacity="0.440">// Xcode theme preview — Ayu, Comfort, GitHub…</tspan></text>
<text x="22" y="43" xml:space="preserve"><tspan fill="#ac3500">import </tspan><tspan fill="#954500">SwiftUI</tspan></text>
