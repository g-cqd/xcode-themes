<text x="22" y="22" xml:space="preserve"><tspan fill="#a6a6a6" fill-opacity="0.680">// Xcode theme preview — Ayu, Comfort, GitHub…</tspan></text>
<text x="22" y="43" xml:space="preserve"><tspan fill="#000000">import </tspan><tspan fill="#232323">SwiftUI</tspan></text>
<text x="22" y="64" xml:space="preserve"></text>
<text x="22" y="85" xml:space="preserve"><tspan fill="#a6a6a6" fill-opacity="0.850">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#232323">@Observable </tspan><tspan fill="#000000">final class </tspan><tspan fill="#232323">Counter</tspan><tspan fill="#545454"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#545454">    </tspan><tspan fill="#000000">var </tspan><tspan fill="#000000">value</tspan><tspan fill="#545454">: </tspan><tspan fill="#232323">Int</tspan><tspan fill="#545454"> = </tspan><tspan fill="#828282">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#545454">    </tspan><tspan fill="#000000">let </tspan><tspan fill="#000000">label</tspan><tspan fill="#545454"> = </tspan><tspan fill="#545454">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#545454">    </tspan><tspan fill="#000000">func </tspan><tspan fill="#000000">bump</tspan><tspan fill="#545454">(</tspan><tspan fill="#000000">by</tspan><tspan fill="#545454"> step: </tspan><tspan fill="#232323">Int</tspan><tspan fill="#545454">) { </tspan><tspan fill="#545454">value</tspan><tspan fill="#545454"> += </tspan><tspan fill="#545454">step</tspan><tspan fill="#545454"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#545454">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#000000">struct </tspan><tspan fill="#232323">CounterView</tspan><tspan fill="#545454">: </tspan><tspan fill="#232323">View</tspan><tspan fill="#545454"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#545454">    </tspan><tspan fill="#232323">@State </tspan><tspan fill="#000000">private var </tspan><tspan fill="#000000">model</tspan><tspan fill="#545454"> = </tspan><tspan fill="#232323">Counter</tspan><tspan fill="#545454">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#545454">    </tspan><tspan fill="#000000">var </tspan><tspan fill="#000000">body</tspan><tspan fill="#545454">: </tspan><tspan fill="#000000">some </tspan><tspan fill="#232323">View</tspan><tspan fill="#545454"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#545454">        </tspan><tspan fill="#232323">Button</tspan><tspan fill="#545454">(</tspan><tspan fill="#545454">model</tspan><tspan fill="#545454">.</tspan><tspan fill="#545454">label</tspan><tspan fill="#545454">) { </tspan><tspan fill="#545454">model</tspan><tspan fill="#545454">.</tspan><tspan fill="#232323">bump</tspan><tspan fill="#545454">(by: </tspan><tspan fill="#828282">1</tspan><tspan fill="#545454">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#545454">            .</tspan><tspan fill="#232323">padding</tspan><tspan fill="#545454">(</tspan><tspan fill="#828282">.pi</tspan><tspan fill="#545454"> * </tspan><tspan fill="#828282">2</tspan><tspan fill="#545454">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#545454">            .</tspan><tspan fill="#232323">accessibilityLabel</tspan><tspan fill="#545454">(</tspan><tspan fill="#545454">&quot;Increment&quot;</tspan><tspan fill="#545454">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#545454">    </tspan><tspan fill="#545454">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#545454">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#828282">#if </tspan><tspan fill="#828282">DEBUG</tspan><tspan fill="#545454">   </tspan><tspan fill="#a6a6a6">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#000000">let </tspan><tspan fill="#000000">re</tspan><tspan fill="#545454"> = </tspan><tspan fill="#545454">/[a-z]+\d{2}/</tspan><tspan fill="#545454">; </tspan><tspan fill="#000000">let </tspan><tspan fill="#000000">c</tspan><tspan fill="#545454">: </tspan><tspan fill="#232323">Character</tspan><tspan fill="#545454"> = </tspan><tspan fill="#545454">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#232323">print</tspan><tspan fill="#545454">(</tspan><tspan fill="#545454">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#545454">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#828282">#endif</tspan></text>
