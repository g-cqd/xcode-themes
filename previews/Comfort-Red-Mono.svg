<text x="22" y="85" xml:space="preserve"><tspan fill="#d4c6c3" fill-opacity="0.550">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#f49392">@Observable </tspan><tspan fill="#ff5942">final class </tspan><tspan fill="#e7a68c">Counter</tspan><tspan fill="#d9c4c0"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#d9c4c0">    </tspan><tspan fill="#ff5942">var </tspan><tspan fill="#fbdeda">value</tspan><tspan fill="#d9c4c0">: </tspan><tspan fill="#ff7f4c">Int</tspan><tspan fill="#d9c4c0"> = </tspan><tspan fill="#ff9b67">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#d9c4c0">    </tspan><tspan fill="#ff5942">let </tspan><tspan fill="#fbdeda">label</tspan><tspan fill="#d9c4c0"> = </tspan><tspan fill="#ffbbb6">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#d9c4c0">    </tspan><tspan fill="#ff5942">func </tspan><tspan fill="#fbdeda">bump</tspan><tspan fill="#d9c4c0">(</tspan><tspan fill="#fbdeda">by</tspan><tspan fill="#d9c4c0"> step: </tspan><tspan fill="#ff7f4c">Int</tspan><tspan fill="#d9c4c0">) { </tspan><tspan fill="#d9c4c0">value</tspan><tspan fill="#d9c4c0"> += </tspan><tspan fill="#d9c4c0">step</tspan><tspan fill="#d9c4c0"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#d9c4c0">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#ff5942">struct </tspan><tspan fill="#e7a68c">CounterView</tspan><tspan fill="#d9c4c0">: </tspan><tspan fill="#ff7f4c">View</tspan><tspan fill="#d9c4c0"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#d9c4c0">    </tspan><tspan fill="#f49392">@State </tspan><tspan fill="#ff5942">private var </tspan><tspan fill="#fbdeda">model</tspan><tspan fill="#d9c4c0"> = </tspan><tspan fill="#e7a68c">Counter</tspan><tspan fill="#d9c4c0">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#d9c4c0">    </tspan><tspan fill="#ff5942">var </tspan><tspan fill="#fbdeda">body</tspan><tspan fill="#d9c4c0">: </tspan><tspan fill="#ff5942">some </tspan><tspan fill="#ff7f4c">View</tspan><tspan fill="#d9c4c0"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#d9c4c0">        </tspan><tspan fill="#ff7f4c">Button</tspan><tspan fill="#d9c4c0">(</tspan><tspan fill="#d9c4c0">model</tspan><tspan fill="#d9c4c0">.</tspan><tspan fill="#d9c4c0">label</tspan><tspan fill="#d9c4c0">) { </tspan><tspan fill="#d9c4c0">model</tspan><tspan fill="#d9c4c0">.</tspan><tspan fill="#ffb38b">bump</tspan><tspan fill="#d9c4c0">(by: </tspan><tspan fill="#ff9b67">1</tspan><tspan fill="#d9c4c0">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#d9c4c0">            .</tspan><tspan fill="#ff8e81">padding</tspan><tspan fill="#d9c4c0">(</tspan><tspan fill="#da908d">.pi</tspan><tspan fill="#d9c4c0"> * </tspan><tspan fill="#ff9b67">2</tspan><tspan fill="#d9c4c0">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#d9c4c0">            .</tspan><tspan fill="#ff8e81">accessibilityLabel</tspan><tspan fill="#d9c4c0">(</tspan><tspan fill="#ffbbb6">&quot;Increment&quot;</tspan><tspan fill="#d9c4c0">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#d9c4c0">    </tspan><tspan fill="#d9c4c0">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#d9c4c0">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#ee4e38">#if </tspan><tspan fill="#ee4e38">DEBUG</tspan><tspan fill="#d9c4c0">   </tspan><tspan fill="#d4c6c3" fill-opacity="0.825">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#ff5942">let </tspan><tspan fill="#fbdeda">re</tspan><tspan fill="#d9c4c0"> = </tspan><tspan fill="#fecfba">/[a-z]+\d{2}/</tspan><tspan fill="#d9c4c0">; </tspan><tspan fill="#ff5942">let </tspan><tspan fill="#fbdeda">c</tspan><tspan fill="#d9c4c0">: </tspan><tspan fill="#ff7f4c">Character</tspan><tspan fill="#d9c4c0"> = </tspan><tspan fill="#ed7068">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#ff8e81">print</tspan><tspan fill="#d9c4c0">(</tspan><tspan fill="#ffbbb6">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#d9c4c0">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#ee4e38">#endif</tspan></text>
