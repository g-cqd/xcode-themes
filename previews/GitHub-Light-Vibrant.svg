<text x="22" y="64" xml:space="preserve"></text>
<text x="22" y="85" xml:space="preserve"><tspan fill="#818a93" fill-opacity="0.620">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#be3600">@Observable </tspan><tspan fill="#d51f27">final class </tspan><tspan fill="#9a4300">Counter</tspan><tspan fill="#545c66"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#d51f27">var </tspan><tspan fill="#292f35">value</tspan><tspan fill="#545c66">: </tspan><tspan fill="#00469e">Int</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#377bce">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#d51f27">let </tspan><tspan fill="#292f35">label</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#003372">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#d51f27">func </tspan><tspan fill="#292f35">bump</tspan><tspan fill="#545c66">(</tspan><tspan fill="#292f35">by</tspan><tspan fill="#545c66"> step: </tspan><tspan fill="#00469e">Int</tspan><tspan fill="#545c66">) { </tspan><tspan fill="#545c66">value</tspan><tspan fill="#545c66"> += </tspan><tspan fill="#545c66">step</tspan><tspan fill="#545c66"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#545c66">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#d51f27">struct </tspan><tspan fill="#9a4300">CounterView</tspan><tspan fill="#545c66">: </tspan><tspan fill="#00469e">View</tspan><tspan fill="#545c66"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#be3600">@State </tspan><tspan fill="#d51f27">private var </tspan><tspan fill="#292f35">model</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#9a4300">Counter</tspan><tspan fill="#545c66">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#d51f27">var </tspan><tspan fill="#292f35">body</tspan><tspan fill="#545c66">: </tspan><tspan fill="#d51f27">some </tspan><tspan fill="#00469e">View</tspan><tspan fill="#545c66"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#545c66">        </tspan><tspan fill="#00469e">Button</tspan><tspan fill="#545c66">(</tspan><tspan fill="#545c66">model</tspan><tspan fill="#545c66">.</tspan><tspan fill="#545c66">label</tspan><tspan fill="#545c66">) { </tspan><tspan fill="#545c66">model</tspan><tspan fill="#545c66">.</tspan><tspan fill="#682cde">bump</tspan><tspan fill="#545c66">(by: </tspan><tspan fill="#377bce">1</tspan><tspan fill="#545c66">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#545c66">            .</tspan><tspan fill="#5a00cc">padding</tspan><tspan fill="#545c66">(</tspan><tspan fill="#1e6abe">.pi</tspan><tspan fill="#545c66"> * </tspan><tspan fill="#377bce">2</tspan><tspan fill="#545c66">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#545c66">            .</tspan><tspan fill="#5a00cc">accessibilityLabel</tspan><tspan fill="#545c66">(</tspan><tspan fill="#003372">&quot;Increment&quot;</tspan><tspan fill="#545c66">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#545c66">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#545c66">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#bc007b">#if </tspan><tspan fill="#bc007b">DEBUG</tspan><tspan fill="#545c66">   </tspan><tspan fill="#818a93" fill-opacity="0.930">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#d51f27">let </tspan><tspan fill="#292f35">re</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#006d23">/[a-z]+\d{2}/</tspan><tspan fill="#545c66">; </tspan><tspan fill="#d51f27">let </tspan><tspan fill="#292f35">c</tspan><tspan fill="#545c66">: </tspan><tspan fill="#00469e">Character</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#be0000">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#5a00cc">print</tspan><tspan fill="#545c66">(</tspan><tspan fill="#003372">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#545c66">)</tspan></text>
