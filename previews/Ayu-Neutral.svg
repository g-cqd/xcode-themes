<text x="22" y="22" xml:space="preserve"><tspan fill="#6d7986" fill-opacity="0.560">// Xcode theme preview — Ayu, Comfort, GitHub…</tspan></text>
<text x="22" y="43" xml:space="preserve"><tspan fill="#ffa04b">import </tspan><tspan fill="#4cd5f1">SwiftUI</tspan></text>
<text x="22" y="64" xml:space="preserve"></text>
<text x="22" y="85" xml:space="preserve"><tspan fill="#6d7986" fill-opacity="0.700">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#ebcb9c">@Observable </tspan><tspan fill="#ffa04b">final class </tspan><tspan fill="#79cdff">Counter</tspan><tspan fill="#cbc9c3"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#cbc9c3">    </tspan><tspan fill="#ffa04b">var </tspan><tspan fill="#e6e4de">value</tspan><tspan fill="#cbc9c3">: </tspan><tspan fill="#4cd5f1">Int</tspan><tspan fill="#cbc9c3"> = </tspan><tspan fill="#d2acf6">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#cbc9c3">    </tspan><tspan fill="#ffa04b">let </tspan><tspan fill="#e6e4de">label</tspan><tspan fill="#cbc9c3"> = </tspan><tspan fill="#b8e05e">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#cbc9c3">    </tspan><tspan fill="#ffa04b">func </tspan><tspan fill="#e6e4de">bump</tspan><tspan fill="#cbc9c3">(</tspan><tspan fill="#e6e4de">by</tspan><tspan fill="#cbc9c3"> step: </tspan><tspan fill="#4cd5f1">Int</tspan><tspan fill="#cbc9c3">) { </tspan><tspan fill="#cbc9c3">value</tspan><tspan fill="#cbc9c3"> += </tspan><tspan fill="#cbc9c3">step</tspan><tspan fill="#cbc9c3"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#cbc9c3">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#ffa04b">struct </tspan><tspan fill="#79cdff">CounterView</tspan><tspan fill="#cbc9c3">: </tspan><tspan fill="#4cd5f1">View</tspan><tspan fill="#cbc9c3"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#cbc9c3">    </tspan><tspan fill="#ebcb9c">@State </tspan><tspan fill="#ffa04b">private var </tspan><tspan fill="#e6e4de">model</tspan><tspan fill="#cbc9c3"> = </tspan><tspan fill="#79cdff">Counter</tspan><tspan fill="#cbc9c3">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#cbc9c3">    </tspan><tspan fill="#ffa04b">var </tspan><tspan fill="#e6e4de">body</tspan><tspan fill="#cbc9c3">: </tspan><tspan fill="#ffa04b">some </tspan><tspan fill="#4cd5f1">View</tspan><tspan fill="#cbc9c3"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#cbc9c3">        </tspan><tspan fill="#4cd5f1">Button</tspan><tspan fill="#cbc9c3">(</tspan><tspan fill="#cbc9c3">model</tspan><tspan fill="#cbc9c3">.</tspan><tspan fill="#cbc9c3">label</tspan><tspan fill="#cbc9c3">) { </tspan><tspan fill="#cbc9c3">model</tspan><tspan fill="#cbc9c3">.</tspan><tspan fill="#ffc167">bump</tspan><tspan fill="#cbc9c3">(by: </tspan><tspan fill="#d2acf6">1</tspan><tspan fill="#cbc9c3">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#cbc9c3">            .</tspan><tspan fill="#ea7a82">padding</tspan><tspan fill="#cbc9c3">(</tspan><tspan fill="#eb9d73">.pi</tspan><tspan fill="#cbc9c3"> * </tspan><tspan fill="#d2acf6">2</tspan><tspan fill="#cbc9c3">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#cbc9c3">            .</tspan><tspan fill="#ea7a82">accessibilityLabel</tspan><tspan fill="#cbc9c3">(</tspan><tspan fill="#b8e05e">&quot;Increment&quot;</tspan><tspan fill="#cbc9c3">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#cbc9c3">    </tspan><tspan fill="#cbc9c3">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#cbc9c3">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#fc8e94">#if </tspan><tspan fill="#fc8e94">DEBUG</tspan><tspan fill="#cbc9c3">   </tspan><tspan fill="#6d7986">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#ffa04b">let </tspan><tspan fill="#e6e4de">re</tspan><tspan fill="#cbc9c3"> = </tspan><tspan fill="#aff3dd">/[a-z]+\d{2}/</tspan><tspan fill="#cbc9c3">; </tspan><tspan fill="#ffa04b">let </tspan><tspan fill="#e6e4de">c</tspan><tspan fill="#cbc9c3">: </tspan><tspan fill="#4cd5f1">Character</tspan><tspan fill="#cbc9c3"> = </tspan><tspan fill="#9ce2cc">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#ea7a82">print</tspan><tspan fill="#cbc9c3">(</tspan><tspan fill="#23b8dc">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#cbc9c3">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#fc8e94">#endif</tspan></text>
