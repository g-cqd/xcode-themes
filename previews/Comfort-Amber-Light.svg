<text x="22" y="85" xml:space="preserve"><tspan fill="#534e3d" fill-opacity="0.550">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#804200">@Observable </tspan><tspan fill="#aa3f00">final class </tspan><tspan fill="#573300">Counter</tspan><tspan fill="#544e35"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#544e35">    </tspan><tspan fill="#aa3f00">var </tspan><tspan fill="#2a1e01">value</tspan><tspan fill="#544e35">: </tspan><tspan fill="#7e5b11">Int</tspan><tspan fill="#544e35"> = </tspan><tspan fill="#005e00">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#544e35">    </tspan><tspan fill="#aa3f00">let </tspan><tspan fill="#2a1e01">label</tspan><tspan fill="#544e35"> = </tspan><tspan fill="#004b00">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#544e35">    </tspan><tspan fill="#aa3f00">func </tspan><tspan fill="#2a1e01">bump</tspan><tspan fill="#544e35">(</tspan><tspan fill="#2a1e01">by</tspan><tspan fill="#544e35"> step: </tspan><tspan fill="#7e5b11">Int</tspan><tspan fill="#544e35">) { </tspan><tspan fill="#544e35">value</tspan><tspan fill="#544e35"> += </tspan><tspan fill="#544e35">step</tspan><tspan fill="#544e35"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#544e35">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#aa3f00">struct </tspan><tspan fill="#573300">CounterView</tspan><tspan fill="#544e35">: </tspan><tspan fill="#7e5b11">View</tspan><tspan fill="#544e35"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#544e35">    </tspan><tspan fill="#804200">@State </tspan><tspan fill="#aa3f00">private var </tspan><tspan fill="#2a1e01">model</tspan><tspan fill="#544e35"> = </tspan><tspan fill="#573300">Counter</tspan><tspan fill="#544e35">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#544e35">    </tspan><tspan fill="#aa3f00">var </tspan><tspan fill="#2a1e01">body</tspan><tspan fill="#544e35">: </tspan><tspan fill="#aa3f00">some </tspan><tspan fill="#7e5b11">View</tspan><tspan fill="#544e35"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#544e35">        </tspan><tspan fill="#7e5b11">Button</tspan><tspan fill="#544e35">(</tspan><tspan fill="#544e35">model</tspan><tspan fill="#544e35">.</tspan><tspan fill="#544e35">label</tspan><tspan fill="#544e35">) { </tspan><tspan fill="#544e35">model</tspan><tspan fill="#544e35">.</tspan><tspan fill="#323100">bump</tspan><tspan fill="#544e35">(by: </tspan><tspan fill="#005e00">1</tspan><tspan fill="#544e35">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#544e35">            .</tspan><tspan fill="#455504">padding</tspan><tspan fill="#544e35">(</tspan><tspan fill="#626000">.pi</tspan><tspan fill="#544e35"> * </tspan><tspan fill="#005e00">2</tspan><tspan fill="#544e35">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#544e35">            .</tspan><tspan fill="#455504">accessibilityLabel</tspan><tspan fill="#544e35">(</tspan><tspan fill="#004b00">&quot;Increment&quot;</tspan><tspan fill="#544e35">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#544e35">    </tspan><tspan fill="#544e35">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#544e35">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#bd5000">#if </tspan><tspan fill="#bd5000">DEBUG</tspan><tspan fill="#544e35">   </tspan><tspan fill="#534e3d" fill-opacity="0.825">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#aa3f00">let </tspan><tspan fill="#2a1e01">re</tspan><tspan fill="#544e35"> = </tspan><tspan fill="#003600">/[a-z]+\d{2}/</tspan><tspan fill="#544e35">; </tspan><tspan fill="#aa3f00">let </tspan><tspan fill="#2a1e01">c</tspan><tspan fill="#544e35">: </tspan><tspan fill="#7e5b11">Character</tspan><tspan fill="#544e35"> = </tspan><tspan fill="#a15d00">&quot;x&quot;</tspan></text>
