<text x="22" y="85" xml:space="preserve"><tspan fill="#686868" fill-opacity="0.850">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#d7d7d7">@Observable </tspan><tspan fill="#fefefe">final class </tspan><tspan fill="#d7d7d7">Counter</tspan><tspan fill="#b1b1b1"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#b1b1b1">    </tspan><tspan fill="#fefefe">var </tspan><tspan fill="#fefefe">value</tspan><tspan fill="#b1b1b1">: </tspan><tspan fill="#d7d7d7">Int</tspan><tspan fill="#b1b1b1"> = </tspan><tspan fill="#8a8a8a">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#b1b1b1">    </tspan><tspan fill="#fefefe">let </tspan><tspan fill="#fefefe">label</tspan><tspan fill="#b1b1b1"> = </tspan><tspan fill="#b1b1b1">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#b1b1b1">    </tspan><tspan fill="#fefefe">func </tspan><tspan fill="#fefefe">bump</tspan><tspan fill="#b1b1b1">(</tspan><tspan fill="#fefefe">by</tspan><tspan fill="#b1b1b1"> step: </tspan><tspan fill="#d7d7d7">Int</tspan><tspan fill="#b1b1b1">) { </tspan><tspan fill="#b1b1b1">value</tspan><tspan fill="#b1b1b1"> += </tspan><tspan fill="#b1b1b1">step</tspan><tspan fill="#b1b1b1"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#b1b1b1">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#fefefe">struct </tspan><tspan fill="#d7d7d7">CounterView</tspan><tspan fill="#b1b1b1">: </tspan><tspan fill="#d7d7d7">View</tspan><tspan fill="#b1b1b1"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#b1b1b1">    </tspan><tspan fill="#d7d7d7">@State </tspan><tspan fill="#fefefe">private var </tspan><tspan fill="#fefefe">model</tspan><tspan fill="#b1b1b1"> = </tspan><tspan fill="#d7d7d7">Counter</tspan><tspan fill="#b1b1b1">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#b1b1b1">    </tspan><tspan fill="#fefefe">var </tspan><tspan fill="#fefefe">body</tspan><tspan fill="#b1b1b1">: </tspan><tspan fill="#fefefe">some </tspan><tspan fill="#d7d7d7">View</tspan><tspan fill="#b1b1b1"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#b1b1b1">        </tspan><tspan fill="#d7d7d7">Button</tspan><tspan fill="#b1b1b1">(</tspan><tspan fill="#b1b1b1">model</tspan><tspan fill="#b1b1b1">.</tspan><tspan fill="#b1b1b1">label</tspan><tspan fill="#b1b1b1">) { </tspan><tspan fill="#b1b1b1">model</tspan><tspan fill="#b1b1b1">.</tspan><tspan fill="#d7d7d7">bump</tspan><tspan fill="#b1b1b1">(by: </tspan><tspan fill="#8a8a8a">1</tspan><tspan fill="#b1b1b1">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#b1b1b1">            .</tspan><tspan fill="#d7d7d7">padding</tspan><tspan fill="#b1b1b1">(</tspan><tspan fill="#8a8a8a">.pi</tspan><tspan fill="#b1b1b1"> * </tspan><tspan fill="#8a8a8a">2</tspan><tspan fill="#b1b1b1">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#b1b1b1">            .</tspan><tspan fill="#d7d7d7">accessibilityLabel</tspan><tspan fill="#b1b1b1">(</tspan><tspan fill="#b1b1b1">&quot;Increment&quot;</tspan><tspan fill="#b1b1b1">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#b1b1b1">    </tspan><tspan fill="#b1b1b1">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#b1b1b1">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#8a8a8a">#if </tspan><tspan fill="#8a8a8a">DEBUG</tspan><tspan fill="#b1b1b1">   </tspan><tspan fill="#686868">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#fefefe">let </tspan><tspan fill="#fefefe">re</tspan><tspan fill="#b1b1b1"> = </tspan><tspan fill="#b1b1b1">/[a-z]+\d{2}/</tspan><tspan fill="#b1b1b1">; </tspan><tspan fill="#fefefe">let </tspan><tspan fill="#fefefe">c</tspan><tspan fill="#b1b1b1">: </tspan><tspan fill="#d7d7d7">Character</tspan><tspan fill="#b1b1b1"> = </tspan><tspan fill="#b1b1b1">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#d7d7d7">print</tspan><tspan fill="#b1b1b1">(</tspan><tspan fill="#b1b1b1">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#b1b1b1">)</tspan></text>
