<text x="22" y="22" xml:space="preserve"><tspan fill="#818a93" fill-opacity="0.496">// Xcode theme preview — Ayu, Comfort, GitHub…</tspan></text>
<text x="22" y="43" xml:space="preserve"><tspan fill="#df2128">import </tspan><tspan fill="#004ba7">SwiftUI</tspan></text>
<text x="22" y="64" xml:space="preserve"></text>
<text x="22" y="85" xml:space="preserve"><tspan fill="#818a93" fill-opacity="0.620">/// A tiny view model showing every syntax color.</tspan></text>
<text x="22" y="106" xml:space="preserve"><tspan fill="#c83b03">@Observable </tspan><tspan fill="#df2128">final class </tspan><tspan fill="#a24600">Counter</tspan><tspan fill="#545c66"> {</tspan></text>
<text x="22" y="127" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#df2128">var </tspan><tspan fill="#292f35">value</tspan><tspan fill="#545c66">: </tspan><tspan fill="#004ba7">Int</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#3880d7">0</tspan></text>
<text x="22" y="148" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#df2128">let </tspan><tspan fill="#292f35">label</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#003679">&quot;Count: \(value)&quot;</tspan></text>
<text x="22" y="169" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#df2128">func </tspan><tspan fill="#292f35">bump</tspan><tspan fill="#545c66">(</tspan><tspan fill="#292f35">by</tspan><tspan fill="#545c66"> step: </tspan><tspan fill="#004ba7">Int</tspan><tspan fill="#545c66">) { </tspan><tspan fill="#545c66">value</tspan><tspan fill="#545c66"> += </tspan><tspan fill="#545c66">step</tspan><tspan fill="#545c66"> }</tspan></text>
<text x="22" y="190" xml:space="preserve"><tspan fill="#545c66">}</tspan></text>
<text x="22" y="211" xml:space="preserve"></text>
<text x="22" y="232" xml:space="preserve"><tspan fill="#df2128">struct </tspan><tspan fill="#a24600">CounterView</tspan><tspan fill="#545c66">: </tspan><tspan fill="#004ba7">View</tspan><tspan fill="#545c66"> {</tspan></text>
<text x="22" y="253" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#c83b03">@State </tspan><tspan fill="#df2128">private var </tspan><tspan fill="#292f35">model</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#a24600">Counter</tspan><tspan fill="#545c66">()</tspan></text>
<text x="22" y="274" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#df2128">var </tspan><tspan fill="#292f35">body</tspan><tspan fill="#545c66">: </tspan><tspan fill="#df2128">some </tspan><tspan fill="#004ba7">View</tspan><tspan fill="#545c66"> {</tspan></text>
<text x="22" y="295" xml:space="preserve"><tspan fill="#545c66">        </tspan><tspan fill="#004ba7">Button</tspan><tspan fill="#545c66">(</tspan><tspan fill="#545c66">model</tspan><tspan fill="#545c66">.</tspan><tspan fill="#545c66">label</tspan><tspan fill="#545c66">) { </tspan><tspan fill="#545c66">model</tspan><tspan fill="#545c66">.</tspan><tspan fill="#8348e9">bump</tspan><tspan fill="#545c66">(by: </tspan><tspan fill="#3880d7">1</tspan><tspan fill="#545c66">) }</tspan></text>
<text x="22" y="316" xml:space="preserve"><tspan fill="#545c66">            .</tspan><tspan fill="#7324d7">padding</tspan><tspan fill="#545c66">(</tspan><tspan fill="#206fc7">.pi</tspan><tspan fill="#545c66"> * </tspan><tspan fill="#3880d7">2</tspan><tspan fill="#545c66">)</tspan></text>
<text x="22" y="337" xml:space="preserve"><tspan fill="#545c66">            .</tspan><tspan fill="#7324d7">accessibilityLabel</tspan><tspan fill="#545c66">(</tspan><tspan fill="#003679">&quot;Increment&quot;</tspan><tspan fill="#545c66">)</tspan></text>
<text x="22" y="358" xml:space="preserve"><tspan fill="#545c66">    </tspan><tspan fill="#545c66">}</tspan></text>
<text x="22" y="379" xml:space="preserve"><tspan fill="#545c66">}</tspan></text>
<text x="22" y="400" xml:space="preserve"></text>
<text x="22" y="421" xml:space="preserve"><tspan fill="#c61e8b">#if </tspan><tspan fill="#c61e8b">DEBUG</tspan><tspan fill="#545c66">   </tspan><tspan fill="#818a93" fill-opacity="0.930">// MARK: - Regex &amp; chars</tspan></text>
<text x="22" y="442" xml:space="preserve"><tspan fill="#df2128">let </tspan><tspan fill="#292f35">re</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#007325">/[a-z]+\d{2}/</tspan><tspan fill="#545c66">; </tspan><tspan fill="#df2128">let </tspan><tspan fill="#292f35">c</tspan><tspan fill="#545c66">: </tspan><tspan fill="#004ba7">Character</tspan><tspan fill="#545c66"> = </tspan><tspan fill="#c90000">&quot;x&quot;</tspan></text>
<text x="22" y="463" xml:space="preserve"><tspan fill="#7324d7">print</tspan><tspan fill="#545c66">(</tspan><tspan fill="#003679">&quot;https://developer.apple.com&quot;</tspan><tspan fill="#545c66">)</tspan></text>
<text x="22" y="484" xml:space="preserve"><tspan fill="#c61e8b">#endif</tspan></text>
